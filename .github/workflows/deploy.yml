name: Frontend release (manual)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        options: [build, upload, switch, commit, rollback]
      commit:
        description: Reviewed full frontend commit
        required: true
        type: string
      build_run_id:
        description: Successful reviewed build run; required for upload
        required: false
        type: string
      manifest_sha256:
        description: Reviewed build artifact manifest SHA256; ignored for build
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: frontend-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      OP: ${{ inputs.operation }}
      COMMIT: ${{ inputs.commit }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - name: Validate reviewed inputs
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          case "$OP" in build|upload|switch|commit|rollback) ;; *) exit 2 ;; esac
          if [ "$OP" = upload ]; then [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]; fi
          echo "SHORT=${COMMIT:0:7}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Pin helper bytes to the reviewed checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          echo "CHECK_B64=$(base64 -w0 scripts/release/manifest.cjs)" >> "$GITHUB_ENV"
          echo "CHECK_SHA=$(sha256sum scripts/release/manifest.cjs | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SWITCH_B64=$(base64 -w0 scripts/release/switch.cjs)" >> "$GITHUB_ENV"
          echo "SWITCH_SHA=$(sha256sum scripts/release/switch.cjs | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: inputs.operation == 'build'
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies (CI only)
        if: inputs.operation == 'build'
        run: npm ci
      - name: Build canonical frontend
        if: inputs.operation == 'build'
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3000/api
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          node --test scripts/release/release.spec.cjs
          mkdir -p out
          GOT="$(bash scripts/release/build.sh out/release)"
          echo "manifest sha256: $GOT"
          node scripts/release/manifest.cjs verify out/release "$GOT"
          tar --hard-dereference -C out -czf "frontend-${SHORT}.tgz" release
          node scripts/release/artifact.cjs create release-info.json "$COMMIT" "$GITHUB_RUN_ID" "$GOT" "frontend-${SHORT}.tgz"
      - name: Retain exact verified build once
        if: inputs.operation == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ inputs.commit }}
          retention-days: 1
          if-no-files-found: error
          path: |
            frontend-${{ env.SHORT }}.tgz
            release-info.json
      - name: Download the reviewed build without rebuilding
        if: inputs.operation == 'upload'
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ inputs.commit }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incoming
      - name: Verify build provenance and complete payload before transfer
        if: inputs.operation == 'upload'
        run: |
          set -euo pipefail
          ARCHIVE_SHA256="$(node scripts/release/artifact.cjs verify incoming/release-info.json "$COMMIT" "$BUILD_RUN_ID" "$MANIFEST_SHA256" "incoming/frontend-${SHORT}.tgz")"
          mkdir -p out/verify
          tar -tzf "incoming/frontend-${SHORT}.tgz" > out/archive-index
          while IFS= read -r ENTRY; do
            case "$ENTRY" in release|release/|release/*) ;; *) exit 2 ;; esac
            case "/$ENTRY/" in *'/../'*|*'/./'*) exit 2 ;; esac
          done < out/archive-index
          tar -tvzf "incoming/frontend-${SHORT}.tgz" > out/archive-types
          while IFS= read -r ENTRY; do [[ "$ENTRY" =~ ^[-d][rwxStTs-]{9}[[:space:]] ]]; done < out/archive-types
          tar --no-same-owner -xzf "incoming/frontend-${SHORT}.tgz" -C out/verify
          node scripts/release/manifest.cjs verify out/verify/release "$MANIFEST_SHA256"
          cp "incoming/frontend-${SHORT}.tgz" "frontend-${SHORT}.tgz"
          echo "ARCHIVE_SHA256=$ARCHIVE_SHA256" >> "$GITHUB_ENV"
      - name: Preflight destination or perform separate manual activation
        if: inputs.operation != 'build'
        uses: appleboy/ssh-action@v1.0.3
        env:
          CHECK_B64: ${{ env.CHECK_B64 }}
          CHECK_SHA: ${{ env.CHECK_SHA }}
          SWITCH_B64: ${{ env.SWITCH_B64 }}
          SWITCH_SHA: ${{ env.SWITCH_SHA }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          command_timeout: 4m
          envs: CHECK_B64,CHECK_SHA,SWITCH_B64,SWITCH_SHA,COMMIT,MANIFEST_SHA256,OP
          script: |
            set -euo pipefail
            umask 077
            case "$OP" in upload) MODE=preflight ;; switch|commit|rollback) MODE="$OP" ;; *) exit 2 ;; esac
            D="$(mktemp -d /tmp/lw-front-release.XXXXXX)"
            trap 'rm -f -- "$D/manifest.cjs" "$D/switch.cjs"; rmdir "$D" 2>/dev/null || true' EXIT
            printf '%s' "$CHECK_B64" | base64 -d > "$D/manifest.cjs"
            printf '%s' "$SWITCH_B64" | base64 -d > "$D/switch.cjs"
            [ "$(sha256sum "$D/manifest.cjs" | cut -d' ' -f1)" = "$CHECK_SHA" ]
            [ "$(sha256sum "$D/switch.cjs" | cut -d' ' -f1)" = "$SWITCH_SHA" ]
            LW_PM2_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v pm2)")")")"
            export LW_PM2_ROOT
            node "$D/switch.cjs" "$MODE" "$COMMIT" "$MANIFEST_SHA256"
      - name: Upload verified archive to incoming only
        if: inputs.operation == 'upload'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: frontend-${{ env.SHORT }}.tgz
          target: /home/ec2-user/frontend-release-incoming/${{ github.run_id }}
      - name: Verify archive and publish immutable release only
        if: inputs.operation == 'upload'
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHORT: ${{ env.SHORT }}
          RUN_ID: ${{ github.run_id }}
          ARCHIVE_SHA256: ${{ env.ARCHIVE_SHA256 }}
          CHECK_SHA: ${{ env.CHECK_SHA }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          envs: SHORT,RUN_ID,ARCHIVE_SHA256,CHECK_SHA,MANIFEST_SHA256
          script: |
            set -euo pipefail
            umask 077
            [[ "$SHORT" =~ ^[0-9a-f]{7}$ && "$RUN_ID" =~ ^[0-9]+$ && "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            BASE=/home/ec2-user/labwise-frontend-releases
            if [ ! -e "$BASE" ]; then mkdir -m 700 -- "$BASE"; fi
            [ -d "$BASE" ] && [ ! -L "$BASE" ] && [ "$(realpath "$BASE")" = "$BASE" ]
            DEST="$BASE/$SHORT"
            [ ! -e "$DEST" ] || { echo '{"result":"HOLD","reason":"release_exists"}'; exit 2; }
            ARCHIVE="/home/ec2-user/frontend-release-incoming/$RUN_ID/frontend-$SHORT.tgz"
            [ -f "$ARCHIVE" ] && [ ! -L "$ARCHIVE" ]
            [ "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" = "$ARCHIVE_SHA256" ]
            STAGE="$(mktemp -d "$BASE/.stage-XXXXXX")"
            CLAIMED=0
            cleanup() {
              rm -f -- "$STAGE/index" "$STAGE/types"
              rmdir "$STAGE" 2>/dev/null || true
              if [ "$CLAIMED" = 1 ]; then rmdir "$DEST" 2>/dev/null || true; fi
            }
            trap cleanup EXIT
            tar -tzf "$ARCHIVE" > "$STAGE/index"
            while IFS= read -r ENTRY; do
              case "$ENTRY" in release|release/|release/*) ;; *) exit 2 ;; esac
              case "/$ENTRY/" in *'/../'*|*'/./'*) exit 2 ;; esac
            done < "$STAGE/index"
            tar -tvzf "$ARCHIVE" > "$STAGE/types"
            while IFS= read -r ENTRY; do [[ "$ENTRY" =~ ^[-d][rwxStTs-]{9}[[:space:]] ]]; done < "$STAGE/types"
            tar --no-same-owner -xzf "$ARCHIVE" -C "$STAGE"
            [ -f "$STAGE/release/scripts/release/manifest.cjs" ] && [ ! -L "$STAGE/release/scripts/release/manifest.cjs" ]
            [ "$(sha256sum "$STAGE/release/scripts/release/manifest.cjs" | cut -d' ' -f1)" = "$CHECK_SHA" ]
            node "$STAGE/release/scripts/release/manifest.cjs" verify "$STAGE/release" "$MANIFEST_SHA256"
            mkdir -- "$DEST" || { echo '{"result":"HOLD","reason":"release_exists"}'; exit 2; }
            CLAIMED=1
            mv -T -- "$STAGE/release" "$DEST"
            CLAIMED=0
            echo "FRONTEND_UPLOAD_VERIFIED $SHORT"
